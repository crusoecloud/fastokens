[package]
name = "gigatoken-worker"
version = "0.0.0"
edition = "2024"
publish = false
description = "bench/rust worker for gigatoken (nightly-only, so kept out of that crate)"

# Standalone, like bench/rust.
[workspace]

[dependencies]
# gigatoken 0.10.0's source release (not on crates.io): `./fetch.sh` unpacks it here.
gigatoken = { path = "vendor/gigatoken-0.10.0" }
hf-hub = { version = "0.4.3", default-features = false, features = ["rustls-tls", "ureq"] }
serde_json = "1"
anyhow = "1"

# As gigatoken builds its own release (fat LTO).
[profile.release]
lto = "fat"
