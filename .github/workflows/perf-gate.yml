name: Perf gate

# The serving benchmark (bench/rust) on a pull request's source against its
# target branch: fails when a scenario gets slower than the threshold (see
# bench/perf-gate.sh and bench/rust/src/gate.rs). To block merging on it, make
# the "perf-gate" check required in the target branch's protection rules.
# Run it by hand to compare any two refs, e.g. a release candidate against the
# last release tag.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: "Ref to compare against (branch, tag or sha), e.g. v0.3.2"
        required: true
        default: main

concurrency:
  group: perf-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A pull request checks out its merge commit, whose first parent is the
      # target branch it merges into: exactly the change under review.
      - name: Resolve base
        id: base
        env:
          INPUT_BASE: ${{ inputs.base }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=HEAD^1
            echo "base_label=$GITHUB_BASE_REF ($(git rev-parse --short HEAD^1))" >> "$GITHUB_OUTPUT"
            echo "head_label=#$PR_NUMBER ($(git rev-parse --short HEAD^2))" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet "origin/$INPUT_BASE^{commit}" >/dev/null; then
            base=origin/$INPUT_BASE
          else
            base=$INPUT_BASE
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
          # Only the library and the benchmark itself can move the numbers.
          if git diff --quiet "$base" HEAD -- src Cargo.toml Cargo.lock bench/rust bench/perf-gate.sh .github/workflows/perf-gate.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Perf gate skipped: no changes to the library or the benchmark." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.base.outputs.run == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.base.outputs.run == 'true'
        with:
          workspaces: bench/rust

      # Tokenizers and datasets (~1.4 GB), fetched from the Hugging Face Hub once.
      - name: Restore Hugging Face cache
        id: hf
        if: steps.base.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: perf-gate-hf-v1

      - name: Run perf gate
        if: steps.base.outputs.run == 'true'
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
          PERF_GATE_BASE_LABEL: ${{ steps.base.outputs.base_label }}
          PERF_GATE_HEAD_LABEL: ${{ steps.base.outputs.head_label }}
        run: bench/perf-gate.sh "$BASE_REF"

      # Saved even when the gate fails on a regression, but only once the
      # datasets are complete, so a partial download is never frozen in.
      - name: Check Hugging Face cache
        id: hf-complete
        if: ${{ !cancelled() && steps.base.outputs.run == 'true' && steps.hf.outputs.cache-hit != 'true' }}
        run: |
          hub=~/.cache/huggingface/hub
          if ls $hub/datasets--zai-org--LongBench-v2/snapshots/*/data.json \
                $hub/datasets--RyokoAI--ShareGPT52K/snapshots/*/sg_90k_part1.json >/dev/null 2>&1; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Hugging Face cache
        if: ${{ !cancelled() && steps.hf-complete.outputs.complete == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface/hub
          key: perf-gate-hf-v1
