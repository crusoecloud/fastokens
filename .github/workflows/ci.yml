name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

  citation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"

      - name: Check CITATION.cff version matches Cargo.toml
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          cff_version=$(sed -n 's/^version: *//p' CITATION.cff)
          if [ "$cargo_version" != "$cff_version" ]; then
            echo "::error file=CITATION.cff::version is '$cff_version' but Cargo.toml is '$cargo_version'; bump version and date-released"
            exit 1
          fi

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build and install wheel
        run: maturin build --release --out dist && pip install dist/*.whl

      - name: Smoke test
        run: |
          python - <<'EOF'
          import fastokens
          tok = fastokens.Tokenizer.from_model("Qwen/Qwen3-0.6B")
          ids = tok.encode("hello world", add_special_tokens=False)
          assert len(ids.ids) > 0, "encode returned empty ids"
          decoded = tok.decode(list(ids.ids))
          assert decoded == "hello world", f"unexpected decode: {decoded!r}"
          print("smoke test passed")
          EOF

  patch-transformers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transformers: ["4.57.1", "5.3.0"]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build and install wheel
        run: maturin build --release --out dist && pip install dist/*.whl

      - name: Install transformers ${{ matrix.transformers }} and pytest
        run: pip install transformers==${{ matrix.transformers }} pytest

      - name: Test patch_transformers
        run: pytest python/tests/test_patch_transformers.py python/tests/test_add_tokens.py -v
